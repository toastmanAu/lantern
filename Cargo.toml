# Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/wallet-core",
    "crates/vault",
    "crates/chain-backend",
    "crates/extension-host",
    "crates/tx-builder",
    "crates/account-registry",
    "crates/signer-secp256k1",
    "crates/signer-ledger",
    "crates/signer-passkey",
    "crates/signer-mldsa",
    "crates/sdk-schema",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/wallet-core",
    "crates/vault",
    "crates/chain-backend",
    "crates/extension-host",
    "crates/tx-builder",
    "crates/account-registry",
    "crates/signer-secp256k1",
    "crates/signer-ledger",
    "crates/signer-passkey",
    "crates/signer-mldsa",
    "crates/sdk-schema",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Lantern contributors"]
repository = "https://github.com/toastmanAu/lantern"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Errors and logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Crypto (plan 1b: vault)
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
ciborium = "0.2"

# Keys + signing (plan 1c)
secp256k1 = { version = "0.33", features = ["recovery"] }
hmac = "0.12"
ckb-hash = "=1.1.0" # 1.1.1 raised rust-version to 1.95; toolchain is pinned at 1.92
bip39 = { version = "2.2", features = ["rand", "zeroize"] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
bech32 = "0.12"
hex = { version = "0.4", features = ["serde"] }
region = "4.0"

# Chain access (plan 1d)
# ckb-jsonrpc-types 1.2.0 and ckb-types 1.1.2+ raise rust-version to 1.95;
# the toolchain is pinned at 1.92, so both are exact-pinned here.
ckb-jsonrpc-types = "=1.1.1"
ckb-types = "=1.1.1"

# ckb-types pulls in 11 further ckb-* crates transitively, none of them
# pinned directly in this manifest — their versions are held down only by
# Cargo.lock, for the same 1.92-vs-1.95 MSRV reason as the pins above:
# ckb-constant, ckb-error, ckb-fixed-hash, ckb-fixed-hash-core,
# ckb-fixed-hash-macros, ckb-gen-types, ckb-merkle-mountain-range,
# ckb-occupied-capacity, ckb-occupied-capacity-core,
# ckb-occupied-capacity-macros, ckb-rational. Do not `cargo update -p` any
# of these without first bumping the toolchain past 1.95.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset"] }
toml = "0.9"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Schema generation (specta + tauri-specta) — pinned in plans 1c+ when first command lands
specta = "=2.0.0-rc.20"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "0.0.7"

# Tauri (the desktop app crate references workspace tauri version directly)
tauri = { version = "2.2" }
tauri-build = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these — too noisy or stylistic
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
