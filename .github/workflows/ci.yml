# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps for tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy (vault without mlock)
        run: cargo clippy -p lantern-vault --all-targets --no-default-features -- -D warnings

      - name: cargo test (vault without mlock)
        run: cargo test -p lantern-vault --no-default-features

      - name: cargo test (chain-backend with the fake node)
        run: cargo test -p lantern-chain-backend --features testing

      - name: cargo test (chain-backend, no-default-features build guard)
        run: cargo test -p lantern-chain-backend

      - name: cargo test (tx-builder)
        run: cargo test -p lantern-tx-builder

  frontend:
    name: Frontend workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json;
      # passing `version` as well makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm build (workspace)
        run: pnpm -r build

      - name: pnpm test (workspace)
        run: pnpm -r test
